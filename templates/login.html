<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="icon">💰</div>
            </div>
            <h1>Bem-vindo de volta</h1>
            <p class="auth-subtitle">Entre para acessar seu controle financeiro</p>

            {% if erro %}
                <p class="erro-box">{{ erro }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="seuemail@exemplo.com" required>

                <label>Senha</label>
                <input type="password" name="senha" placeholder="••••••••" required>

                <button type="submit">Entrar</button>
            </form>

            <p class="auth-footer">Não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
        </div>
    </div>
</body>
</html>
