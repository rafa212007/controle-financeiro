<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Transação</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>Editar Transação</h1>
            <a href="{{ url_for('index') }}">← Voltar</a>
        </div>

        <div class="form-box">
            <form action="{{ url_for('editar_transacao', id=transacao.id) }}" method="POST">
                <label>Descrição:</label>
                <input type="text" name="descricao" value="{{ transacao.descricao }}" required>

                <label>Valor:</label>
                <input type="number" step="0.01" name="valor" value="{{ transacao.valor }}" required>

                <label>Data:</label>
                <input type="date" name="data" value="{{ transacao.data.strftime('%Y-%m-%d') }}" required>

                <label>Tipo:</label>
                <select name="tipo" required>
                    <option value="receita" {% if transacao.tipo == "receita" %}selected{% endif %}>Receita</option>
                    <option value="despesa" {% if transacao.tipo == "despesa" %}selected{% endif %}>Despesa</option>
                </select>

                <button type="submit">Salvar</button>
            </form>
        </div>
    </div>
</body>
</html>
